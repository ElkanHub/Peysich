<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* the landing page's own look (docs: src/app/page.tsx): a white rounded card on the warm ground */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,Arial,sans-serif;color:#191419;background:#eeeaed;position:relative}
  .card{position:absolute;left:28px;top:28px;right:28px;bottom:28px;background:#fff;border-radius:36px;
    box-shadow:0 2px 8px -2px rgba(43,10,28,.10),0 1px 2px rgba(43,10,28,.06);
    display:grid;grid-template-columns:1.08fr .92fr;gap:24px;align-items:center;padding:52px 56px 52px 64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:-.01em;margin-bottom:26px}
  h1{font-size:60px;line-height:1.02;letter-spacing:-.04em;font-weight:600;margin:0 0 22px;max-width:14ch}
  h1 b{color:#5e1d3e;font-weight:600}
  p.lead{font-size:21px;line-height:1.45;color:#645e66;margin:0 0 30px;max-width:30em}
  .stats{display:flex;gap:36px;border-top:1px solid #dbd4d9;padding-top:22px}
  .stats div{min-width:120px}
  .stats dt{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .stats dd{margin:6px 0 0;font-size:15px;color:#645e66}
  .art{display:flex;align-items:center;justify-content:center;height:100%}
  .art img{display:block;width:100%;max-width:470px;height:auto}
  .url{position:absolute;right:62px;bottom:46px;font-size:17px;font-weight:600;color:#5e1d3e}
</style></head><body>
<div class="card">
  <div>
    <div class="brand"><svg width="28" height="28" viewBox="0 0 64 64"><path d="M12 8h26v22H24v10h26v16H24V44H12z" fill="#0A0A0A"/><path d="M38 8l14 12H38zM24 44l-12 12h12z" fill="#5e1d3e"/></svg> SchoolSpec</div>
    <h1>The <b>school management system</b> built for schools in Ghana</h1>
    <p class="lead">Mark the register in 30 seconds, print report cards under your crest, collect fees by mobile money and keep every parent informed.</p>
    <dl class="stats">
      <div><dt>30s</dt><dd>to mark a register</dd></div>
      <div><dt>1 click</dt><dd>to report cards</dd></div>
      <div><dt>Any phone</dt><dd>MoMo fees + SMS</dd></div>
    </dl>
  </div>
  <div class="art"><img src="__HERO_IMG__" alt=""></div>
</div>
<div class="url">schoolspec.com</div>
</body></html>
